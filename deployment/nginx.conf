limit_req_zone $binary_remote_addr zone=sdo_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name portal.example.gov.ph;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.example.gov.ph;

    ssl_certificate /etc/letsencrypt/live/portal.example.gov.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.example.gov.ph/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 12m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /srv/sdo-sulu/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Only public images/resources are exposed directly. Issuances, historical
    # versions, ticket files, and request attachments go through Django views.
    location /media/public/ {
        alias /srv/sdo-sulu/media/public/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /health/ {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://unix:/run/sdo-sulu/gunicorn.sock;
        access_log off;
    }

    location /account/login/ {
        limit_req zone=sdo_login burst=5 nodelay;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://unix:/run/sdo-sulu/gunicorn.sock;
    }

    location / {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_pass http://unix:/run/sdo-sulu/gunicorn.sock;
    }
}
