{% extends 'base/base.html' %}{% block content %}<h1 class="text-3xl font-bold">{{ school.name }}</h1><dl class="grid md:grid-cols-2 gap-4 mt-5"><div><dt>School ID</dt><dd>{{ school.school_id }}</dd></div><div><dt>District</dt><dd>{{ school.district }}</dd></div><div><dt>Address</dt><dd>{{ school.address }}</dd></div><div><dt>School Head</dt><dd>{{ school.school_head }}</dd></div></dl>{% if school.latitude %}<a class="text-blue-800" href="https://www.openstreetmap.org/?mlat={{ school.latitude }}&mlon={{ school.longitude }}#map=16/{{ school.latitude }}/{{ school.longitude }}">View location on OpenStreetMap</a>{% endif %}{% endblock %}
