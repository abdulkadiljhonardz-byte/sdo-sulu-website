{% extends 'base/base.html' %}{% block content %}<h1 class="text-2xl font-bold">School Directory</h1><form class="my-4"><input class="border p-2" name="q" value="{{ request.GET.q }}" placeholder="Search school or ID"><button class="bg-blue-900 text-white p-2">Search</button></form><div class="grid gap-3">{% for school in schools %}<a class="bg-white p-4 rounded shadow" href="{{ school.pk }}/"><strong>{{ school.name }}</strong><br><small>{{ school.district }} · {{ school.municipality }}</small></a>{% empty %}<p>No schools found.</p>{% endfor %}</div>{% endblock %}
