{% extends 'base/base.html' %}{% block content %}<h1 class="text-2xl font-bold">Track a Request</h1><form><label>Tracking number <input class="border p-2" name="number"></label><button class="bg-blue-900 text-white p-2">Track</button></form>{% if item %}<p class="mt-4">{{ item.tracking_number }}: <strong>{{ item.get_status_display }}</strong></p>{% elif request.GET.number %}<p class="mt-4">No request was found.</p>{% endif %}{% endblock %}
